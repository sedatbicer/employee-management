# ==========================================================
# EMPLOYEE MANAGEMENT - CI/CD PIPELINE
# ==========================================================

name: Employee Management CI/CD

# ----------------------------------------------------------
# 1. WORKFLOW TRIGGER
# ----------------------------------------------------------
# Startet die Pipeline bei Pushes auf die angegebenen Branches
# sowie bei Pull Requests mit Ziel main.
on:
  push:
    branches:
      - main
      - ci-cd-pipeline

  pull_request:
    branches:
      - main

# ----------------------------------------------------------
# 2. BERECHTIGUNGEN
# ----------------------------------------------------------
# Die Pipeline erhält nur die benötigten Leserechte.
permissions:
  contents: read
  pull-requests: read

# Verhindert unnötige parallele Ausführungen.
concurrency:
  group: employee-management-${{ github.ref }}
  cancel-in-progress: true

# ==========================================================
# JOB 1: BACKEND TESTS
# ==========================================================
jobs:
  backend-tests:
    name: Backend Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Beide Backend-Services werden separat getestet.
    strategy:
      fail-fast: false
      matrix:
        service:
          - employee-service
          - auth-service

    # ------------------------------------------------------
    # MYSQL TESTDATENBANK
    # ------------------------------------------------------
    # Für jeden Backend-Service wird eine eigene MySQL-
    # Testdatenbank gestartet.
    services:
      mysql:
        image: mysql:8.4

        env:
          # Root-Passwort abhängig vom Backend-Service.
          MYSQL_ROOT_PASSWORD: ${{ matrix.service == 'employee-service' && secrets.EMPLOYEE_MYSQL_ROOT_PASSWORD || secrets.AUTH_MYSQL_ROOT_PASSWORD }}

          # Datenbankname abhängig vom Backend-Service.
          MYSQL_DATABASE: ${{ matrix.service == 'employee-service' && 'people_hub' || 'people_hub_auth' }}

          # Datenbankbenutzer aus GitHub Secrets.
          MYSQL_USER: ${{ matrix.service == 'employee-service' && secrets.EMPLOYEE_DB_USER || secrets.AUTH_DB_USER }}

          # Datenbankpasswort aus GitHub Secrets.
          MYSQL_PASSWORD: ${{ matrix.service == 'employee-service' && secrets.EMPLOYEE_DB_PASSWORD || secrets.AUTH_DB_PASSWORD }}

        ports:
          - 3306:3306

        # Wartet, bis MySQL erreichbar ist.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # ----------------------------------------------------
      # QUELLCODE HERUNTERLADEN
      # ----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # JAVA INSTALLIEREN
      # ----------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ----------------------------------------------------
      # BACKEND TESTS AUSFÜHREN
      # ----------------------------------------------------
      - name: Run Maven tests
        working-directory: ${{ matrix.service }}

        env:
          # Verbindung zur jeweiligen Testdatenbank.
          DB_URL: jdbc:mysql://127.0.0.1:3306/${{ matrix.service == 'employee-service' && 'people_hub' || 'people_hub_auth' }}

          # Datenbankzugangsdaten aus GitHub Secrets.
          DB_USERNAME: ${{ matrix.service == 'employee-service' && secrets.EMPLOYEE_DB_USER || secrets.AUTH_DB_USER }}

          DB_PASSWORD: ${{ matrix.service == 'employee-service' && secrets.EMPLOYEE_DB_PASSWORD || secrets.AUTH_DB_PASSWORD }}

          # JWT-Schlüssel aus GitHub Secrets.
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

          # Administrator-Zugangsdaten für den Auth-Service.
          AUTH_ADMIN_EMAIL: ${{ secrets.AUTH_ADMIN_EMAIL }}
          AUTH_ADMIN_PASSWORD: ${{ secrets.AUTH_ADMIN_PASSWORD }}

          # CORS-Konfiguration für den CI-Test.
          # Keine geheime Information, daher kein Secret.
          CORS_ALLOWED_ORIGINS: http://localhost:4200

        # Backend kompilieren und Tests ausführen.
        run: mvn -B -ntp test

      # ----------------------------------------------------
      # TESTBERICHTE SPEICHERN
      # ----------------------------------------------------
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-reports
          path: |
            ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

# ==========================================================
# JOB 2: FRONTEND BUILD UND SECURITY CHECK
# ==========================================================
  frontend-build:
    name: Frontend Build & Security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Quellcode herunterladen.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node.js installieren.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: employee-frontend/package-lock.json

      # Abhängigkeiten anhand der Lockdatei installieren.
      - name: Install frontend dependencies
        working-directory: employee-frontend
        run: npm ci

      # Sicherheitsprüfung der npm-Abhängigkeiten.
      - name: Audit npm dependencies
        working-directory: employee-frontend
        run: npm audit --audit-level=high

      # Produktiven Angular-Build erstellen.
      - name: Build Angular application
        working-directory: employee-frontend
        run: npm run build -- --configuration production

      # Build-Ergebnis als Artefakt speichern.
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: angular-production-build
          path: employee-frontend/dist/
          retention-days: 14

# ==========================================================
# JOB 3: DEPENDENCY SECURITY REVIEW
# ==========================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Nur bei Pull Requests ausführen.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Prüft neue oder aktualisierte Abhängigkeiten
      # anhand der GitHub Advisory Database.
      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

# ==========================================================
# JOB 4: DOCKER BUILD UND INTEGRATION TESTS
# ==========================================================
  docker-integration:
    name: Docker Build & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Erst starten, wenn Backend und Frontend erfolgreich sind.
    needs:
      - backend-tests
      - frontend-build

    steps:
      # Quellcode herunterladen.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Docker Buildx bereitstellen.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------
      # DOCKER COMPOSE: GESAMTSYSTEM STARTEN
      # ----------------------------------------------------
      - name: Build and start application

        # Alle benötigten Zugangsdaten werden aus GitHub
        # Repository Secrets übernommen.
        env:
          EMPLOYEE_MYSQL_ROOT_PASSWORD: ${{ secrets.EMPLOYEE_MYSQL_ROOT_PASSWORD }}
          EMPLOYEE_DB_USER: ${{ secrets.EMPLOYEE_DB_USER }}
          EMPLOYEE_DB_PASSWORD: ${{ secrets.EMPLOYEE_DB_PASSWORD }}

          AUTH_MYSQL_ROOT_PASSWORD: ${{ secrets.AUTH_MYSQL_ROOT_PASSWORD }}
          AUTH_DB_USER: ${{ secrets.AUTH_DB_USER }}
          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}

          AUTH_ADMIN_EMAIL: ${{ secrets.AUTH_ADMIN_EMAIL }}
          AUTH_ADMIN_PASSWORD: ${{ secrets.AUTH_ADMIN_PASSWORD }}

        # Baut alle Images und startet die Services.
        run: docker compose up -d --build

      # ----------------------------------------------------
      # EMPLOYEE-SERVICE HEALTH CHECK
      # ----------------------------------------------------
      - name: Check employee service
      run: |
        curl --fail --silent --show-error \
          --retry 30 \
          --retry-all-errors \
          --retry-delay 5 \
          http://127.0.0.1:8081/actuator/health  

      # ----------------------------------------------------
      # AUTH-SERVICE HEALTH CHECK
      # ----------------------------------------------------
      - name: Check auth service
        run: |
          curl --fail --silent --show-error \
            --retry 30 \
            --retry-connrefused \
            --retry-delay 5 \
            http://127.0.0.1:8082/actuator/health

      # ----------------------------------------------------
      # FRONTEND HEALTH CHECK
      # ----------------------------------------------------
      - name: Check frontend
        run: |
          curl --fail --silent --show-error \
            --retry 20 \
            --retry-connrefused \
            --retry-delay 5 \
            http://127.0.0.1:4200/

      # ----------------------------------------------------
      # FEHLERANALYSE
      # ----------------------------------------------------
      # Container-Logs nur bei einem Fehler anzeigen.
      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "===== CONTAINER STATUS ====="
          docker compose ps -a

          echo "===== EMPLOYEE SERVICE ====="
          docker logs employee-service

          echo "===== EMPLOYEE MYSQL ====="
          docker logs people-hub-mysql

          echo "===== AUTH SERVICE ====="
          docker logs auth-service

      # ----------------------------------------------------
      # AUFRÄUMEN
      # ----------------------------------------------------
      # Container und temporäre Datenbank-Volumes entfernen.
      - name: Stop and clean up containers
        if: always()
        run: docker compose down --volumes --remove-orphans
