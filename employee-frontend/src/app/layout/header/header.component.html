<header class="topbar">

  <!-- Linker Kopfzeilenbereich mit mobiler Navigation und Breadcrumb. -->
  <div class="topbar-left">

    <!-- Schaltfläche zum Öffnen und Schließen der mobilen Sidebar. -->
    <button
      class="mobile-menu"
      type="button"
      aria-label="Navigation öffnen"
      (click)="menuToggle.emit()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Breadcrumb zur Orientierung innerhalb der Anwendung. -->
    <nav class="breadcrumb" aria-label="Brotkrumennavigation">

      <!-- Übergeordneter Anwendungsbereich. -->
      <span class="breadcrumb-root">
        Workspace
      </span>

      <!-- Visuelles Trennzeichen zwischen den Navigationselementen. -->
      <svg
        class="breadcrumb-separator"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="m9 18 6-6-6-6" />
      </svg>

      <!-- Dynamische Bezeichnung der aktuell aufgerufenen Seite. -->
      <span class="breadcrumb-current" aria-current="page">
        {{ pageTitle() }}
      </span>

    </nav>

  </div>

  <!-- Rechter Kopfzeilenbereich mit der aktuellen Datumsanzeige. -->
  <div class="topbar-actions">

    <!-- Anzeige des aktuellen Datums im deutschen Format. -->
    <div class="date-display">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M16 3v4M8 3v4M3 10h18" />
      </svg>

      <span>{{ today }}</span>

    </div>

  </div>

</header>
