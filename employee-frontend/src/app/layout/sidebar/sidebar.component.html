
<!-- Hauptcontainer der seitlichen Navigation. -->
<aside
  class="sidebar"
  [class.open]="open()"
  aria-label="Seitliche Navigation"
>

  <!-- Markenbereich mit Logo und Produktbezeichnung. -->
  <div class="brand">

    <div class="brand-mark" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="brand-info">
      <strong>people<span>hub</span></strong>
      <small>PEOPLE OPERATIONS</small>
    </div>

  </div>

  <!-- Hauptnavigation der Anwendung. -->
  <nav class="navigation" aria-label="Hauptnavigation">

    <span class="navigation-label">
      WORKSPACE
    </span>

    <!-- Mitarbeiterübersicht mit dynamischer Anzahl. -->
    <a
      class="nav-item"
      routerLink="/mitarbeiter"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      (click)="close.emit()"
    >

      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M16 21V19C16 16.79 14.21 15 12 15H6C3.79 15 2 16.79 2 19V21"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
          <circle
            cx="9"
            cy="7"
            r="4"
            stroke="currentColor"
            stroke-width="1.7"
          />
          <path
            d="M22 21V19C22 16.9 20.5 15.2 18.5 15"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
          <path
            d="M16 3.2C17.7 3.9 18.8 5.3 18.8 7C18.8 8.7 17.7 10.1 16 10.8"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span class="nav-text">
        Mitarbeiter
      </span>

      <span class="nav-count">
        {{ employeeService.employeeCount() }}
      </span>

    </a>

  </nav>

  <!-- Unterer Bereich mit Benutzerinformationen und Abmeldung. -->
  <div class="sidebar-bottom">

    <!-- Dezente Informationskarte. -->
    <div class="help-card">

      <div class="help-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M12 3L14.4 9.6L21 12L14.4 14.4L12 21L9.6 14.4L3 12L9.6 9.6L12 3Z"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <strong>Alles im Blick.</strong>

      <p>Dein Team. An einem Ort.</p>

      <span class="help-caption">
        PEOPLE OPERATIONS
      </span>

    </div>

    <!-- Informationen des aktuell angemeldeten Benutzers. -->
    <div class="user-profile">

      <!-- Automatisch generierte Benutzerinitialen. -->
      <div class="user-avatar">
        {{ userInitials() }}
      </div>

      <!-- E-Mail-Adresse und Benutzerrolle. -->
      <div class="user-info">

        <strong [title]="userEmail() ?? ''">
          {{ userEmail() || 'Benutzer' }}
        </strong>

        <span>
          {{ roleLabel() }}
        </span>

      </div>

      <!-- Abmeldeaktion. -->
      <button
        class="logout-button"
        type="button"
        aria-label="Abmelden"
        title="Abmelden"
        (click)="logout()"
      >
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M10 17L15 12L10 7"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M15 12H3"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
          <path
            d="M12 3H19C20.1 3 21 3.9 21 5V19C21 20.1 20.1 21 19 21H12"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </button>

    </div>

  </div>

</aside>

<!-- Halbtransparenter Hintergrund zum Schließen der mobilen Navigation. -->
@if (open()) {
  <button
    class="backdrop"
    type="button"
    aria-label="Navigation schließen"
    (click)="close.emit()"
  ></button>
}
