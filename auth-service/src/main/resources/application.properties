# Allgemeine Anwendungskonfiguration
spring.application.name=auth-service
server.port=${SERVER_PORT:8082}


# Datenbankverbindung
# Die Zugangsdaten werden über Umgebungsvariablen bereitgestellt.
# Die Standardwerte dienen ausschließlich der lokalen Entwicklung.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/people_hub_auth}
spring.datasource.username=${DB_USERNAME:authuser}
spring.datasource.password=${DB_PASSWORD:authDbPassword123!}


# JPA- und Hibernate-Konfiguration
# Aktualisiert das Datenbankschema automatisch anhand der Entity-Klassen.
spring.jpa.hibernate.ddl-auto=update

# Verhindert, dass Datenbankzugriffe außerhalb der Service-Schicht erfolgen.
spring.jpa.open-in-view=false

# Aktiviert die Ausgabe der SQL-Anweisungen in der Konsole.
spring.jpa.show-sql=true

# Formatiert die ausgegebenen SQL-Anweisungen für bessere Lesbarkeit.
spring.jpa.properties.hibernate.format_sql=true


# JWT-Konfiguration
# Das gemeinsame Signaturgeheimnis wird über eine Umgebungsvariable bereitgestellt.
security.jwt.secret=${JWT_SECRET}

# Gültigkeitsdauer eines JWT in Millisekunden (1 Stunde).
security.jwt.expiration-ms=3600000


# Initialisierung des Administratorkontos
# Die Zugangsdaten werden über Umgebungsvariablen bereitgestellt.
app.admin.email=${AUTH_ADMIN_EMAIL}
app.admin.password=${AUTH_ADMIN_PASSWORD}


# Erlaubte CORS-Ursprünge werden umgebungsabhängig konfiguriert.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Health-Endpunkte für Kubernetes Liveness- und Readiness-Probes.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true