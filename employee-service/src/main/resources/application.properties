# Name der Spring-Boot-Anwendung.
spring.application.name=employee-service

# Port des Employee-Service.
# Falls keine Umgebungsvariable SERVER_PORT gesetzt ist,
# wird standardmäßig Port 8081 verwendet.
server.port=${SERVER_PORT:8081}


# --------------------------------------------------
# Datenbankverbindung
# --------------------------------------------------

# JDBC-Verbindungsadresse zur MySQL-Datenbank.
# Standardmäßig wird eine lokale MySQL-Instanz verwendet.
# In Docker wird die Verbindungsadresse über DB_URL gesetzt.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/people_hub}

# Zugangsdaten für die Datenbankverbindung.
# Die Werte können über Umgebungsvariablen überschrieben werden.
spring.datasource.username=${DB_USERNAME:peoplehub}
spring.datasource.password=${DB_PASSWORD:localAppPassword123!}


# --------------------------------------------------
# JPA- und Hibernate-Konfiguration
# --------------------------------------------------

# Hibernate aktualisiert das Datenbankschema automatisch
# anhand der Änderungen an den Entity-Klassen.
spring.jpa.hibernate.ddl-auto=update

# Verhindert, dass Datenbankzugriffe außerhalb
# einer Service-Transaktion automatisch geöffnet bleiben.
spring.jpa.open-in-view=false

# Gibt SQL-Anweisungen zur Entwicklungs- und Fehleranalyse aus.
spring.jpa.show-sql=true

# Formatiert ausgegebene SQL-Anweisungen für bessere Lesbarkeit.
spring.jpa.properties.hibernate.format_sql=true


# --------------------------------------------------
# JWT-Sicherheit
# --------------------------------------------------

# Gemeinsames Geheimnis zur Überprüfung der JWT-Signaturen.
# Der Wert muss über die Umgebungsvariable JWT_SECRET
# bereitgestellt werden.
security.jwt.secret=${JWT_SECRET}


# Erlaubte CORS-Ursprünge werden umgebungsabhängig konfiguriert.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Health-Endpunkte für Kubernetes Liveness- und Readiness-Probes.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true