
services:

  # ==================================
  # MYSQL - EMPLOYEE SERVICE
  # ==================================
  mysql-employee:
    image: mysql:8.4
    container_name: people-hub-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${EMPLOYEE_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: people_hub
      MYSQL_USER: ${EMPLOYEE_DB_USER}
      MYSQL_PASSWORD: ${EMPLOYEE_DB_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - employee-db-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # ==================================
  # MYSQL - AUTH SERVICE
  # ==================================
  mysql-auth:
    image: mysql:8.4
    container_name: people-hub-auth-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: people_hub_auth
      MYSQL_USER: ${AUTH_DB_USER}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - auth-db-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # ==================================
  # EMPLOYEE SERVICE
  # ==================================
  employee-service:
    build:
      context: ./employee-service

    container_name: employee-service
    restart: unless-stopped

    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql-employee:3306/people_hub
      DB_USERNAME: ${EMPLOYEE_DB_USER}
      DB_PASSWORD: ${EMPLOYEE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

      # Erlaubte Frontend-Origin für CORS-Anfragen.
      # Die Adresse entspricht dem lokal veröffentlichten Angular-Frontend.
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:4200"

    ports:
      - "8081:8081"

    depends_on:
      mysql-employee:
        condition: service_healthy


  # ==================================
  # AUTH SERVICE
  # ==================================
  auth-service:
    build:
      context: ./auth-service

    container_name: auth-service
    restart: unless-stopped

    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql-auth:3306/people_hub_auth
      DB_USERNAME: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}

      # Erlaubte Frontend-Origin für CORS-Anfragen.
      # Die Adresse entspricht dem lokal veröffentlichten Angular-Frontend.
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:4200"

    ports:
      - "8082:8082"

    depends_on:
      mysql-auth:
        condition: service_healthy


  # ==================================
  # ANGULAR FRONTEND + NGINX
  # ==================================
  employee-frontend:
    build:
      context: ./employee-frontend

    container_name: employee-frontend
    restart: unless-stopped

    ports:
      - "4200:80"

    depends_on:
      - employee-service
      - auth-service


# ==================================
# PERSISTENT DATABASE VOLUMES
# ==================================
volumes:
  employee-db-data:
    name: people-hub-mysql-data

  auth-db-data:
    name: people-hub-auth-mysql-data
