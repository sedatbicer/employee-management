# =============================================================================
# Employee Management - Auth Service
# =============================================================================
#
# Zweck:
# Dieser Kubernetes Service stellt eine stabile Netzwerkadresse für den
# Auth-Service bereit.
#
# Architektur:
# - Namespace: employee-backend
# - Service-Typ: ClusterIP
# - Service-Port: 8082
# - Ziel-Port: 8082 (Spring Boot)
#
# Funktionsweise:
# Der Service leitet eingehende Verbindungen an die Auth-Service-Pods weiter.
# Die Zuordnung erfolgt anhand der definierten Labels.
#
# DNS:
# auth-service.employee-backend.svc.cluster.local
#
# Wichtige Hinweise:
# - Der Service ist innerhalb des Kubernetes-Clusters erreichbar.
# - Die zugehörigen Pods werden später über ein Deployment bereitgestellt.
# - Der Service kann bereits vor dem Start der Pods erstellt werden.
#
# =============================================================================

apiVersion: v1
kind: Service

metadata:
  name: auth-service
  namespace: employee-backend
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: employee-management

spec:
  type: ClusterIP

  # Verknüpfung mit den Auth-Service-Pods.
  selector:
    app.kubernetes.io/name: auth-service

  ports:
    - name: http
      protocol: TCP
      port: 8082
      targetPort: http