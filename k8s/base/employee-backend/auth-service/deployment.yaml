
# Deployment für den Auth-Service.
# Verwaltet die gewünschte Anzahl der Anwendungs-Pods und stellt
# die Konfiguration für den Betrieb innerhalb des Kubernetes-Clusters bereit.
# Der Auth-Service übernimmt die Authentifizierung und die JWT-Verarbeitung.
apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: employee-backend
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: employee-management
    app.kubernetes.io/component: backend

spec:
  # Eine Instanz für die lokale Entwicklungsumgebung.
  # Eine höhere Replikazahl kann später für Skalierung verwendet werden.
  replicas: 1

  # Verbindet das Deployment mit den Pods anhand ihres Anwendungslabels.
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service

  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: employee-management
        app.kubernetes.io/component: backend

    spec:
      containers:
        - name: auth-service

          # Lokal gebautes Anwendungsimage.
          # IfNotPresent verhindert unnötige Image-Pulls,
          # sofern das Image in der Container-Runtime verfügbar ist.
          image: auth-service:1.0.5
          imagePullPolicy: IfNotPresent

          # Gemeinsame, nicht vertrauliche Konfiguration für beide Backend-Services.
          # Die CORS-Einstellungen werden zentral über eine ConfigMap bereitgestellt.
          envFrom:
            - configMapRef:
                name: backend-cors-config

          # HTTP-Port des Spring-Boot-Services.
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP

          # Startup-Probe: Gibt dem Auth-Service ausreichend Zeit,
          # Spring Boot und die erforderlichen Komponenten zu starten.
          # Während dieser Zeit werden Liveness- und Readiness-Probes zurückgestellt.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24

          # Liveness-Probe: Erkennt, ob der Auth-Service noch funktionsfähig ist.
          # Bei wiederholtem Fehlschlagen startet Kubernetes den Container neu.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness-Probe: Prüft, ob der Auth-Service bereit ist,
          # eingehende Anfragen über seinen Kubernetes-Service zu empfangen.
          # Bei Fehlschlagen wird der Pod vorübergehend aus den Service-Endpunkten entfernt.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Anwendungskonfiguration über Umgebungsvariablen.
          env:
            - name: SERVER_PORT
              value: "8082"

            # Kubernetes-interne DNS-Adresse des Auth-MySQL-Service.
            - name: DB_URL
              value: "jdbc:mysql://auth-mysql.employee-database.svc.cluster.local:3306/people_hub_auth"

            # Datenbankzugangsdaten werden nicht direkt im Manifest gespeichert.
            # Sie werden aus dem namespacegebundenen Kubernetes-Secret gelesen.
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: DB_PASSWORD

            # Gemeinsames JWT-Secret für die dienstübergreifende Token-Prüfung.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: JWT_SECRET

            # Zugangsdaten für die initiale Administrator-Konfiguration.
            # Beide Werte werden sicher aus dem Kubernetes-Secret gelesen.
            - name: AUTH_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: AUTH_ADMIN_EMAIL

            - name: AUTH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: AUTH_ADMIN_PASSWORD

          # Ressourcenanforderungen und Obergrenzen für den Container.
          # Die Werte dienen als Ausgangspunkt für die lokale Umgebung.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
