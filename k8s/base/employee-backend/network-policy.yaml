
# NetworkPolicy für die Backend-Dienste.
#
# Sicherheitsziel:
# - Erlaubt eingehende Verbindungen ausschließlich vom Frontend.
# - Employee Service ist über TCP-Port 8081 erreichbar.
# - Auth Service ist über TCP-Port 8082 erreichbar.
# - Ausgehender Netzwerkverkehr bleibt uneingeschränkt erlaubt.
#
# Die Kombination aus namespaceSelector und podSelector innerhalb
# desselben from-Eintrags bedeutet, dass beide Selektoren erfüllt
# sein müssen (UND-Verknüpfung).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  # Eindeutiger Name der Backend-NetworkPolicy.
  name: backend-allow-frontend
  namespace: employee-backend

spec:
  # Die Policy gilt für beide Backend-Pods.
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/part-of: employee-management

  # Ausschließlich eingehender Netzwerkverkehr wird eingeschränkt.
  policyTypes:
    - Ingress

  ingress:
    # Erlaubt Verbindungen ausschließlich von Frontend-Pods
    # innerhalb des Namespace employee-frontend.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: employee-frontend
          podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
              app.kubernetes.io/part-of: employee-management

      # Erlaubte Backend-Ports:
      # 8081 = Employee Service
      # 8082 = Auth Service
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
