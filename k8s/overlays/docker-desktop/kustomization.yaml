# =============================================================================
# Kustomize-Overlay für Docker Desktop
# =============================================================================
#
# Zweck:
# Definiert die umgebungsspezifische Bereitstellung der Anwendung.
#
# Container-Images:
# Alle Anwendungsimages werden aus der privaten GitHub Container Registry
# (GHCR) bezogen. Die Commit-SHA-Tags ermöglichen eine nachvollziehbare
# Zuordnung zu einem konkreten Quellcode-Stand.
#
# Image-Zugriff:
# Das Kubernetes-Secret ghcr-pull-secret ermöglicht den authentifizierten
# Zugriff auf private Container-Images.
#
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Private GHCR-Images mit eindeutigem Commit-SHA verwenden.
images:
  - name: employee-frontend
    newName: ghcr.io/sedatbicer/employee-frontend
    newTag: sha-bd690e2f8bad0dcdefe8e299a0d8f5cd2f0d6f92
  - name: employee-service
    newName: ghcr.io/sedatbicer/employee-service
    newTag: sha-bd690e2f8bad0dcdefe8e299a0d8f5cd2f0d6f92
  - name: auth-service
    newName: ghcr.io/sedatbicer/auth-service
    newTag: sha-bd690e2f8bad0dcdefe8e299a0d8f5cd2f0d6f92

# Image-Pull-Secret für alle drei Anwendungsdeployments konfigurieren.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: employee-frontend
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull-secret
    
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: employee-service
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull-secret
    
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: auth-service
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull-secret
