# Kustomize-Overlay für die lokale Docker-Desktop-Umgebung.
#
# Dieses Overlay verwendet die gemeinsame Kubernetes-Basis.
# Umgebungsspezifische Anpassungen können hier später ergänzt werden,
# ohne die allgemeinen Ressourcen unter k8s/base zu verändern.
#
# Die Basis enthält:
# - Angular-Frontend mit integriertem Nginx
# - Employee Service und Auth Service
# - Employee- und Auth-MySQL-Datenbank
# - Services, PersistentVolumeClaims und NetworkPolicies
#
# Dieses Overlay verändert zunächst keine Ressourcen.
# Es stellt lediglich die Verbindung zur gemeinsamen Basis her.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base